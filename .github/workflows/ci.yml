name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests and the end-to-end run never call the model; demo mode needs no key.
      ANTHROPIC_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package.json depends on file:../ui, so the component library has to sit next to this checkout.
      # actions/checkout cannot write outside the workspace, so check it out here and move it up a level.
      - uses: actions/checkout@v4
        with:
          repository: eylulg/ui
          path: ui-src

      - name: Build the component library
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build

      - run: npm ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    env:
      ANTHROPIC_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/checkout@v4
        with:
          repository: eylulg/ui
          path: ui-src

      - name: Build the component library
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build

      - run: npm ci
      - run: npm run build
      - name: Lighthouse budgets
        run: npx lhci autorun
