name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests and the end-to-end run never call the model; demo mode needs no key.
      ANTHROPIC_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # package.json depends on file:../ui, so the component library has to sit next to this checkout.
      # actions/checkout cannot write outside the workspace, so check it out here and move it up a level.
      - uses: actions/checkout@v7
        with:
          repository: eylulg/ui
          path: ui-src

      - name: Build the component library
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build

      # install-links copies the library in, as the local relink does. A symlink would give TypeScript two
      # copies of the React types. npm ci cannot be used: the lockfile records the library as a link.
      - run: npm install --no-audit --no-fund --install-links

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    env:
      ANTHROPIC_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/checkout@v7
        with:
          repository: eylulg/ui
          path: ui-src

      - name: Build the component library
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build

      # install-links copies the library in, as the local relink does. A symlink would give TypeScript two
      # copies of the React types. npm ci cannot be used: the lockfile records the library as a link.
      - run: npm install --no-audit --no-fund --install-links
      - run: npm run build
      - name: Lighthouse budgets
        run: npx lhci autorun
